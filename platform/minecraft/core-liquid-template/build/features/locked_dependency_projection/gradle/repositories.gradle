import groovy.json.JsonSlurper

if (project.ext.has('sfmRepositoriesConfigured')) {
    throw new GradleException("repositories.gradle must not be applied more than once")
}

def sfmLockfilePath = file('sfm-toolchain.lock.json')
if (!sfmLockfilePath.isFile()) {
    throw new GradleException("Missing toolchain dependency lockfile: ${sfmLockfilePath}")
}
def sfmLockfile = new JsonSlurper().parse(sfmLockfilePath)
if (!(sfmLockfile.schema_version in [3, 4])) {
    throw new GradleException("Gradle repository projection requires schema version 3 or 4")
}
if (!project.ext.has('sfmEffectiveDependencies')) {
    throw new GradleException("repositories.gradle requires lockfile-features.gradle")
}
def sfmGradleRepositoryIds = new LinkedHashSet<String>()
sfmEffectiveDependencies.each { dependency ->
    dependency.components.each { component ->
        component.declaration.acquisition.each { kind, acquisition ->
            if (acquisition.repository_id) sfmGradleRepositoryIds.add(acquisition.repository_id)
        }
    }
}

// Opt in to the checkout-local cache without requiring Rust. The path is
// relative to this generated project's fixed catalog location, not the shell's
// working directory. Keep the existing cache selection until cutover is
// separately approved.
def sfmUseRepositoryToolchainData = project.findProperty('sfmUseRepositoryToolchainData')
if (sfmUseRepositoryToolchainData != null
        && !(sfmUseRepositoryToolchainData.toString() in ['true', 'false'])) {
    throw new GradleException('sfmUseRepositoryToolchainData must be true or false')
}
def sfmCacheRoot
if (sfmUseRepositoryToolchainData?.toString() == 'true') {
    def sfmRepository = project.projectDir.toPath().toAbsolutePath()
            .resolve('../../../../../').normalize()
    def sfmProjectionParent = sfmRepository.resolve('platform/minecraft/projections')
    if (!sfmRepository.resolve('.git').toFile().exists()
            || !project.projectDir.toPath().toAbsolutePath().normalize().parent.parent.equals(sfmProjectionParent)) {
        throw new GradleException('Repository toolchain data requires a catalog project inside the SFM checkout')
    }
    sfmCacheRoot = sfmRepository.resolve('sfm-toolchain-data').toString()
} else {
    // The propagation CLI materializes source-built and remote artifacts under
    // its managed Maven cache. Preserve this legacy selection for other tasks.
    sfmCacheRoot = System.getenv('SFM_PROPAGATE_CHANGES_CACHE')
}
if (!sfmCacheRoot) {
    def sfmUserHome = new File(System.getProperty('user.home'))
    def sfmOsName = System.getProperty('os.name').toLowerCase()
    if (sfmOsName.contains('win')) {
        def sfmLocalAppData = System.getenv('LOCALAPPDATA')
        sfmCacheRoot = sfmLocalAppData
                ? new File(sfmLocalAppData, 'teamdman/sfm-propagate-changes/cache').path
                : new File(sfmUserHome, 'AppData/Local/teamdman/sfm-propagate-changes/cache').path
    } else if (sfmOsName.contains('mac')) {
        sfmCacheRoot = new File(
                sfmUserHome,
                'Library/Caches/teamdman/sfm-propagate-changes'
        ).path
    } else {
        def sfmXdgCacheHome = System.getenv('XDG_CACHE_HOME')
        sfmCacheRoot = sfmXdgCacheHome
                ? new File(sfmXdgCacheHome, 'teamdman/sfm-propagate-changes').path
                : new File(sfmUserHome, '.cache/teamdman/sfm-propagate-changes').path
    }
}
def sfmLocalMavenRepository = new File(sfmCacheRoot, 'minecraft-toolchain/maven')
ext.sfmLogicalToolchainCacheRoot = sfmCacheRoot
def sfmSourceBuildModules = sfmSourceBuildArtifacts.collect { artifact ->
    def coordinate = artifact.coordinate?.toString()
    def parts = coordinate == null ? [] : coordinate.split(':') as List
    if (parts.size() < 3) {
        throw new GradleException(
                "Source-built artifact ${artifact.id} must declare a Maven coordinate")
    }
    [parts[0], parts[1]]
}.unique()

repositories {
    if (!sfmSourceBuildModules.isEmpty()) {
        if (!sfmLocalMavenRepository.isDirectory()) {
            throw new GradleException(
                    "Profile '${project.ext.sfmLockfileProfile}' requires source-built artifacts, "
                            + "but the managed Maven cache is missing: ${sfmLocalMavenRepository}")
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'sfm-source-build'
                    url = uri(sfmLocalMavenRepository)
                    // SFM's managed cache records the artifact and provenance sidecar,
                    // but not a Maven POM. Resolve the locked JAR directly.
                    metadataSources {
                        artifact()
                    }
                }
            }
            filter {
                sfmSourceBuildModules.each { module -> includeModule(module[0], module[1]) }
            }
        }
    }

    sfmLockfile.repositories
            .findAll { sfmGradleRepositoryIds.contains(it.id) }
            .each { lockedRepository ->
        maven {
            name = "sfm-${lockedRepository.id}"
            url = uri(lockedRepository.url)
            if (lockedRepository.id == 'cursemaven') {
                content { includeGroup 'curse.maven' }
            }
        }
    }
}

ext.sfmRepositoriesConfigured = true
