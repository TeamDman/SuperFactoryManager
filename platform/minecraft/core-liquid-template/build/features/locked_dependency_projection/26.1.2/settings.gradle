// The locked 26.1.2 projection can bootstrap its existing plugin closure
// using only the JDK and the checked-in manifest. Plain releases keep their
// historical settings input.
pluginManagement {
    def useShared = gradle.startParameter.projectProperties['sfmUseRepositoryToolchainData']
    if (useShared != null && !(useShared in ['true', 'false'])) {
        throw new GradleException('sfmUseRepositoryToolchainData must be true or false')
    }
    repositories {
        if (useShared == 'true') {
            def checkout = settingsDir.toPath().toAbsolutePath()
                    .resolve('../../../../../').normalize()
            def projectionParent = checkout.resolve('platform/minecraft/projections')
            if (!checkout.resolve('.git').toFile().exists()
                    || !settingsDir.toPath().toAbsolutePath().normalize()
                            .parent.parent.equals(projectionParent)) {
                throw new GradleException(
                        'Repository toolchain data requires a catalog project inside the SFM checkout')
            }
            def manifestFile = checkout.resolve(
                    'platform/minecraft/core-liquid-template/build/supplements/gradle-plugin-bootstrap-26.1.2.json')
            if (!java.nio.file.Files.isRegularFile(manifestFile)) {
                throw new GradleException('Missing approved Gradle bootstrap manifest: ' + manifestFile)
            }
            def manifest = new groovy.json.JsonSlurper().parse(manifestFile.toFile())
            if (manifest.schema_version != 1
                    || manifest.root_plugins != [
                        'org.gradle.toolchains.foojay-resolver-convention:org.gradle.toolchains.foojay-resolver-convention.gradle.plugin:0.9.0',
                        'net.neoforged.gradle.userdev:net.neoforged.gradle.userdev.gradle.plugin:7.1.27'
                    ]
                    || manifest.artifacts.size() != 138) {
                throw new GradleException('Unexpected approved Gradle bootstrap manifest identity')
            }
            def projectManifestFile = checkout.resolve(
                    'platform/minecraft/core-liquid-template/build/supplements/gradle-project-bootstrap-26.1.2.json')
            if (!java.nio.file.Files.isRegularFile(projectManifestFile)) {
                throw new GradleException('Missing approved Gradle project manifest: ' + projectManifestFile)
            }
            def projectManifest = new groovy.json.JsonSlurper().parse(projectManifestFile.toFile())
            if (projectManifest.schema_version != 1
                    || projectManifest.configuration_inventory_sha256 !=
                            '14a2b690897f4302c78711d65fd4eb90500291052fbcfd87a0b305c626932bca'
                    || projectManifest.artifacts.size() != 113
                    || projectManifest.artifacts.count {
                        it.coordinate == 'net.neoforged.jst:jst-cli-bundle:2.0.1'
                    } != 3) {
                throw new GradleException('Unexpected approved Gradle project manifest identity')
            }
            def jarManifestFile = checkout.resolve(
                    'platform/minecraft/core-liquid-template/build/supplements/gradle-project-jars-26.1.2.json')
            if (!java.nio.file.Files.isRegularFile(jarManifestFile)) {
                throw new GradleException('Missing approved Gradle project JAR manifest: ' + jarManifestFile)
            }
            def jarManifest = new groovy.json.JsonSlurper().parse(jarManifestFile.toFile())
            if (jarManifest.schema_version != 1
                    || jarManifest.selected_source_lock_sha256 !=
                            '65a43c04b74680e5343b1bfbf504e0b592ed6b23b26e5bc437c97596a143e329'
                    || jarManifest.selected_version_sha256 !=
                            'bedfd4c667d5f73d725fb9bdbf53efa13b8026b8c00e1eb1ab789c25ffbf5ca0'
                    || jarManifest.neoform_child_identity_sha256 !=
                            'eabeb220e2cdfa3f3701e67a401472bd8a2f3adc696c9f300ef494a5ec4b81b2'
                    || jarManifest.artifacts.size() != 119
                    || jarManifest.metadata_only_coordinates.size() != 22) {
                throw new GradleException('Unexpected approved Gradle project JAR manifest identity')
            }
            def repository = checkout.resolve(
                    'sfm-toolchain-data/gradle/bootstrap-maven/26.1.2').normalize()
            java.nio.file.Files.createDirectories(repository)
            def physicalRepository = repository.toRealPath()
            def lockPath = repository.resolve('.publication.lock')
            def channel = java.nio.channels.FileChannel.open(lockPath,
                    java.nio.file.StandardOpenOption.CREATE,
                    java.nio.file.StandardOpenOption.WRITE)
            def publicationLock = channel.lock()
            try {
                def seen = new HashMap<String, Object>()
                (manifest.artifacts + projectManifest.artifacts + jarManifest.artifacts).each { pin ->
                    def coordinate = pin.coordinate.toString().split(':', -1)
                    if (coordinate.length != 3 || !pin.file || !pin.path
                            || !pin.sha256?.toString()?.matches('[0-9a-f]{64}')
                            || !(pin.bytes instanceof Number) || pin.bytes < 1) {
                        throw new GradleException('Invalid Gradle bootstrap pin: ' + pin.coordinate)
                    }
                    def earlier = seen.putIfAbsent(pin.path.toString(), pin)
                    if (earlier != null && (earlier.coordinate != pin.coordinate
                            || earlier.file != pin.file || earlier.sha256 != pin.sha256
                            || earlier.bytes.longValue() != pin.bytes.longValue())) {
                        throw new GradleException('Conflicting Gradle bootstrap pin: ' + pin.coordinate)
                    }
                    def expectedPath = coordinate[0].replace('.', '/') + '/' +
                            coordinate[1] + '/' + coordinate[2] + '/' + pin.file
                    def sourceUri = pin.url == null ? null : new URI(pin.url.toString())
                    def officialRoots = [
                        'repo.maven.apache.org': '/maven2/',
                        'repo1.maven.org': '/maven2/',
                        'maven.minecraftforge.net': '/',
                        'maven.neoforged.net': '/releases/',
                        'plugins.gradle.org': '/m2/',
                        'libraries.minecraft.net': '/'
                    ]
                    if (pin.path != expectedPath || sourceUri?.scheme != 'https'
                            || !officialRoots.containsKey(sourceUri.host)
                            || sourceUri.rawPath != officialRoots[sourceUri.host] + pin.path
                            || sourceUri.rawUserInfo != null || sourceUri.rawQuery != null
                            || sourceUri.rawFragment != null) {
                        throw new GradleException('Unsafe Gradle bootstrap pin path: ' + pin.path)
                    }
                    def target = repository.resolve(pin.path.toString()).normalize()
                    if (!target.startsWith(repository)) {
                        throw new GradleException('Gradle bootstrap path escapes shared root: ' + target)
                    }
                    def existingAncestor = target.parent
                    while (!java.nio.file.Files.exists(existingAncestor,
                            java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
                        existingAncestor = existingAncestor.parent
                    }
                    if (!existingAncestor.toRealPath().startsWith(physicalRepository)) {
                        throw new GradleException('Gradle bootstrap parent escapes shared root: ' + existingAncestor)
                    }
                    java.nio.file.Files.createDirectories(target.parent)
                    if (!target.parent.toRealPath().startsWith(physicalRepository)
                            || java.nio.file.Files.isSymbolicLink(target)) {
                        throw new GradleException('Gradle bootstrap path escapes shared root: ' + target)
                    }
                    def verify = { path ->
                        if (java.nio.file.Files.size(path) != pin.bytes.longValue()) {
                            throw new GradleException('Gradle bootstrap size mismatch: ' + pin.coordinate + ' ' + pin.file)
                        }
                        def digest = java.security.MessageDigest.getInstance('SHA-256')
                        java.nio.file.Files.newInputStream(path).withCloseable { stream ->
                            byte[] block = new byte[65536]
                            int count
                            while ((count = stream.read(block)) != -1) {
                                digest.update(block, 0, count)
                            }
                        }
                        def actual = digest.digest().collect {
                            String.format('%02x', it & 0xff)
                        }.join()
                        if (actual != pin.sha256) {
                            throw new GradleException('Gradle bootstrap digest mismatch: ' + pin.coordinate + ' ' + pin.file)
                        }
                    }
                    def cachedSource = null
                    if (pin.source_cache_path != null) {
                        def sourcePath = pin.source_cache_path.toString().replace('\\', '/')
                        if (!sourcePath.startsWith('sfm-toolchain-data/minecraft-toolchain/')
                                || sourcePath.split('/').any { it.isEmpty() || it == '.' || it == '..' }) {
                            throw new GradleException('Unsafe checked Gradle source path: ' + sourcePath)
                        }
                        cachedSource = checkout.resolve(sourcePath).normalize()
                        def physicalCache = checkout.resolve('sfm-toolchain-data').toRealPath()
                        if (!java.nio.file.Files.isRegularFile(cachedSource,
                                java.nio.file.LinkOption.NOFOLLOW_LINKS)
                                || !cachedSource.toRealPath().startsWith(physicalCache)) {
                            throw new GradleException('Missing or redirected checked Gradle source: ' + sourcePath)
                        }
                        verify(cachedSource)
                    }
                    if (!java.nio.file.Files.exists(target)) {
                        if (cachedSource == null && gradle.startParameter.offline) {
                            throw new GradleException('Missing offline Gradle bootstrap pin: ' + pin.coordinate + ' ' + pin.file)
                        }
                        def temporary = target.resolveSibling(target.fileName.toString()
                                + '.partial-' + java.util.UUID.randomUUID())
                        try {
                            def readSource = {
                                if (cachedSource != null) {
                                    return java.nio.file.Files.newInputStream(cachedSource)
                                }
                                def source = sourceUri.toURL().openConnection()
                                source.connectTimeout = 30000
                                source.readTimeout = 30000
                                source.getInputStream()
                            }
                            readSource().withCloseable { input ->
                                java.nio.file.Files.newOutputStream(temporary,
                                        java.nio.file.StandardOpenOption.CREATE_NEW,
                                        java.nio.file.StandardOpenOption.WRITE).withCloseable { output ->
                                    byte[] block = new byte[65536]
                                    int count
                                    long received = 0
                                    while ((count = input.read(block)) != -1) {
                                        received += count
                                        if (received > pin.bytes.longValue()) {
                                            throw new GradleException('Oversized Gradle bootstrap input: ' + pin.coordinate + ' ' + pin.file)
                                        }
                                        output.write(block, 0, count)
                                    }
                                }
                            }
                            verify(temporary)
                            java.nio.file.Files.move(temporary, target,
                                    java.nio.file.StandardCopyOption.ATOMIC_MOVE)
                        } finally {
                            java.nio.file.Files.deleteIfExists(temporary)
                        }
                    }
                    verify(target)
                }
            } finally {
                publicationLock.close()
                channel.close()
            }
            maven {
                url = repository.toUri()
                metadataSources {
                    mavenPom()
                    gradleMetadata()
                }
            }
        } else {
            gradlePluginPortal()
            maven { url = 'https://maven.neoforged.net/releases' }
            maven { url = 'https://maven.parchmentmc.org' }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'sfm-26.1.2'

// Opt-in compatibility bridge for NeoGradle 7.1.27's v1 launcher metadata
// reader. The selected SFM lock uses the same game version with a different
// asset index; an arbitrary cached Mojang snapshot must not select its inputs.
def lockedMinecraftMetadata = gradle.startParameter.projectProperties['sfmUseLockedMinecraftMetadata']
if (lockedMinecraftMetadata != null && !(lockedMinecraftMetadata in ['true', 'false'])) {
    throw new GradleException('sfmUseLockedMinecraftMetadata must be true or false')
}
if (lockedMinecraftMetadata == 'true') {
    if (gradle.startParameter.projectProperties['sfmUseRepositoryToolchainData'] != 'true') {
        throw new GradleException('Locked Minecraft metadata requires repository toolchain data')
    }
    // NeoGradle refreshes both cache files in online mode even when they
    // already exist. Only its offline reader honors the checked snapshot.
    if (!gradle.startParameter.offline) {
        throw new GradleException('Locked Minecraft metadata requires Gradle --offline')
    }
    def checkout = settingsDir.toPath().toAbsolutePath().resolve('../../../../../').normalize()
    if (!java.nio.file.Files.exists(checkout.resolve('.git')) ||
            !settingsDir.toPath().toAbsolutePath().normalize().parent.parent.equals(
                    checkout.resolve('platform/minecraft/projections'))) {
        throw new GradleException('Locked Minecraft metadata requires a catalog project inside the SFM checkout')
    }
    def utf8 = java.nio.charset.StandardCharsets.UTF_8
    def sha256 = { byte[] bytes ->
        java.security.MessageDigest.getInstance('SHA-256').digest(bytes).collect {
            String.format('%02x', it & 0xff)
        }.join()
    }
    def lockPath = checkout.resolve(
            'platform/minecraft/core-liquid-template/build/lockfiles/26.1.2/schema-4.json')
    if (!java.nio.file.Files.isRegularFile(lockPath, java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
        throw new GradleException('Missing selected 26.1.2 source lock')
    }
    def lockBytes = java.nio.file.Files.readAllBytes(lockPath)
    if (sha256(lockBytes) != '65a43c04b74680e5343b1bfbf504e0b592ed6b23b26e5bc437c97596a143e329') {
        throw new GradleException('Selected 26.1.2 source lock changed')
    }
    def lock = new groovy.json.JsonSlurper().parseText(new String(lockBytes, utf8))
    def selectedUrl = 'https://piston-meta.mojang.com/v1/packages/' +
            'ee044d53f31fdcbfa31be3684ad321d44c81c3a5/26.1.2.json'
    def matches = lock.artifacts.findAll {
        it.url == selectedUrl &&
                it.hash == 'blake3:cd73ceb01e7560d692b718e6ab730afea044b1dd' &&
                it.cache_path.toString().replace('\\', '/') ==
                        '$sfm-cache/minecraft/versions/26.1.2/snapshots/ee044d53f31fdcbfa31be3684ad321d44c81c3a5.json'
    }
    if (matches.size() != 1) {
        throw new GradleException('Selected 26.1.2 Minecraft version pin is absent or ambiguous')
    }
    def selectedPath = checkout.resolve(
            'sfm-toolchain-data/minecraft-toolchain/minecraft/versions/26.1.2/snapshots/ee044d53f31fdcbfa31be3684ad321d44c81c3a5.json')
    if (!java.nio.file.Files.isRegularFile(selectedPath, java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
        throw new GradleException('Missing selected locked 26.1.2 version metadata')
    }
    def selectedBytes = java.nio.file.Files.readAllBytes(selectedPath)
    if (sha256(selectedBytes) != 'bedfd4c667d5f73d725fb9bdbf53efa13b8026b8c00e1eb1ab789c25ffbf5ca0') {
        throw new GradleException('Selected locked 26.1.2 version metadata changed')
    }
    def version = new groovy.json.JsonSlurper().parseText(new String(selectedBytes, utf8))
    if (version.id != '26.1.2' ||
            version.assetIndex.sha1 != '2c17565f9cd7dbb95294e71fe258d65d6a8f0360') {
        throw new GradleException('Selected locked 26.1.2 version or asset index changed')
    }
    def launcherBytes = groovy.json.JsonOutput.toJson([
            versions: [[id: '26.1.2', url: selectedUrl]]
    ]).getBytes(utf8)
    def home = gradle.gradleUserHomeDir.toPath().toAbsolutePath().normalize()
    def cache = home.resolve('caches/minecraft')
    def launcherTarget = cache.resolve('launcher_metadata.json')
    def versionTarget = cache.resolve('versions/26.1.2/metadata.json')
    def checkExisting = { path, byte[] expected ->
        if (java.nio.file.Files.exists(path, java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
            if (!java.nio.file.Files.isRegularFile(path, java.nio.file.LinkOption.NOFOLLOW_LINKS) ||
                    sha256(java.nio.file.Files.readAllBytes(path)) != sha256(expected)) {
                throw new GradleException('Conflicting NeoGradle metadata cache file: ' + path)
            }
        }
    }
    // Check both destinations before making even a lock file. The ordinary
    // Gradle home may contain a different legitimate upstream snapshot.
    checkExisting(launcherTarget, launcherBytes)
    checkExisting(versionTarget, selectedBytes)
    java.nio.file.Files.createDirectories(home)
    def physicalHome = home.toRealPath()
    java.nio.file.Files.createDirectories(cache)
    if (!cache.toRealPath().startsWith(physicalHome)) {
        throw new GradleException('NeoGradle cache parent escapes Gradle user home')
    }
    def adapterLockPath = cache.resolve('.sfm-locked-minecraft-metadata.lock')
    def channel = java.nio.channels.FileChannel.open(adapterLockPath,
            java.nio.file.StandardOpenOption.CREATE,
            java.nio.file.StandardOpenOption.WRITE)
    def adapterLock = channel.lock()
    try {
        def publish = { target, byte[] expected ->
            java.nio.file.Files.createDirectories(target.parent)
            if (!target.parent.toRealPath().startsWith(physicalHome)) {
                throw new GradleException('NeoGradle metadata parent escapes Gradle user home')
            }
            checkExisting(target, expected)
            if (!java.nio.file.Files.exists(target, java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
                def temporary = target.resolveSibling(target.fileName.toString() +
                        '.partial-' + java.util.UUID.randomUUID())
                try {
                    java.nio.file.Files.write(temporary, expected,
                            java.nio.file.StandardOpenOption.CREATE_NEW,
                            java.nio.file.StandardOpenOption.WRITE)
                    java.nio.file.Files.move(temporary, target,
                            java.nio.file.StandardCopyOption.ATOMIC_MOVE)
                } finally {
                    java.nio.file.Files.deleteIfExists(temporary)
                }
            }
            checkExisting(target, expected)
        }
        publish(launcherTarget, launcherBytes)
        publish(versionTarget, selectedBytes)
    } finally {
        adapterLock.close()
        channel.close()
    }
    logger.lifecycle('SFM checked NeoGradle metadata adapter selected the locked 26.1.2 asset index')
}
