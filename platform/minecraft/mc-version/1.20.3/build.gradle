buildscript {
    def sfmGradleProperties = new Properties()
    def sfmGradlePropertiesFile = file('gradle.properties')
    if (!sfmGradlePropertiesFile.isFile()) {
        throw new GradleException("Missing Gradle properties file: ${sfmGradlePropertiesFile}")
    }
    sfmGradlePropertiesFile.withInputStream { sfmGradleProperties.load(it) }

    def sfmPluginVersion = gradle.startParameter.projectProperties.get('minecraft_version')
            ?: sfmGradleProperties.getProperty('minecraft_version')
    if (!sfmPluginVersion) {
        throw new GradleException("Missing minecraft_version Gradle property")
    }
    def sfmPluginClasspathFile = file("gradle/plugins/${sfmPluginVersion}/plugin-classpath.txt")
    if (!sfmPluginClasspathFile.isFile()) {
        throw new GradleException("Missing Gradle plugin classpath file: ${sfmPluginClasspathFile}")
    }

    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
    }
    dependencies {
        sfmPluginClasspathFile
                .readLines('UTF-8')
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') }
                .each { classpath it }
    }
}

// temp reminder: avoid using --rerun-tasks while we are iterating on cleaning up the build.gradle
// as it causes things to get decompiled again and it takes a long time

