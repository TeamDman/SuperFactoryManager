buildscript {
    def sfmGradleProperties = new Properties()
    def sfmGradlePropertiesFile = file('gradle.properties')
    if (!sfmGradlePropertiesFile.isFile()) {
        throw new GradleException("Missing Gradle properties file: ${sfmGradlePropertiesFile}")
    }
    sfmGradlePropertiesFile.withInputStream { sfmGradleProperties.load(it) }

    def sfmPluginVersion = gradle.startParameter.projectProperties.get('minecraft_version')
            ?: sfmGradleProperties.getProperty('minecraft_version')
    if (!sfmPluginVersion) {
        throw new GradleException("Missing minecraft_version Gradle property")
    }
    def sfmPluginClasspathFile = file("gradle/plugins/${sfmPluginVersion}/plugin-classpath.txt")
    if (!sfmPluginClasspathFile.isFile()) {
        throw new GradleException("Missing Gradle plugin classpath file: ${sfmPluginClasspathFile}")
    }

    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
    }
    dependencies {
        sfmPluginClasspathFile
                .readLines('UTF-8')
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') }
                .each { classpath it }
    }
}

// temp reminder: avoid using --rerun-tasks while we are iterating on cleaning up the build.gradle
// as it causes things to get decompiled again and it takes a long time

apply from: "gradle/versioned-plugins.gradle"
apply from: "gradle/java-compiler.gradle"
apply from: "gradle/wrapper.gradle"
apply from: "gradle/archive-name.gradle"
apply from: "gradle/versioned-java-toolchain.gradle"
apply from: "gradle/versioned-access-transformer.gradle"
apply from: "gradle/source-excludes.gradle"

// this must come before runs for the sourcesets to be available when calling modSource project.sourceSets.gametest
apply from: "gradle/source-sets.gradle"

apply from: "gradle/idea-excludes.gradle"



// Ensure sources are available for other modules
apply from: "gradle/versioned-configurations.gradle"
apply from: "gradle/versioned-run-configurations.gradle"

// this is handled in mods.toml from 1.20.2+
//mixin {
//    add sourceSets.main, "sfm.refmap.json"
//    config "sfm.mixins.json"
//    debug.verbose = true
//}

apply from: "gradle/repositories.gradle"

apply from: "gradle/versioned-dependencies.gradle"

apply from: "gradle/versioned-process-resources.gradle"

test {
    useJUnitPlatform()
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}


test {
    useJUnitPlatform()
}

generateGrammarSource {
    arguments = [
            "-visitor",
            "-Xexact-output-dir" // https://stackoverflow.com/a/79058733/11141271 fixes "can't find .tokens file" error for TomlParser.g4
    ]
    outputDirectory = file("${project.buildDir}/generated-src/antlr/main/ca/teamdman/langs")

//    include 'sfml/SFML.g4'
//    // Include the lexer first
//    include 'toml/TomlLexer.g4'
//    include 'toml/TomlParser.g4'
}

compileJava {
    dependsOn generateGrammarSource
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
// However, this causes gradle to throw "Error getting artifact" so keep it commented out to retain your sanity
//idea {
//    module {
//        downloadSources = true
//        downloadJavadoc = true
//    }
//}

// List of fully qualified entry point classes
def entryPoints = [
        'ca.teamdman.ai.ProjectTestMethodLister',
        'ca.teamdman.ai.ProjectEverythingLister',
        'ca.teamdman.ai.FileImportWalker'
        // Add more classes here as needed
]
entryPoints.each { className ->
    // Extract simple class name for the task name (e.g., ProjectTestMethodLister)
    def simpleClassName = className.substring(className.lastIndexOf('.') + 1)

    // Define a task name, e.g., runProjectTestMethodLister
    def taskName = "run${simpleClassName}"

    // Create the JavaExec task
    //noinspection ConfigurationAvoidance
    task(taskName, type: JavaExec) {
        group = 'Execution'
        description = "Runs the ${className} class"

        // Set the main class to run
        mainClass.set(className)

        // Set the classpath to include compiled test classes and dependencies
        classpath = sourceSets.test.runtimeClasspath

        // Optional: Set JVM arguments if needed
        // e.g., jvmArgs = ['-Xmx1G']
    }
}
