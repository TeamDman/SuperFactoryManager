buildscript {
    def sfmGradleProperties = new Properties()
    def sfmGradlePropertiesFile = file('gradle.properties')
    if (!sfmGradlePropertiesFile.isFile()) {
        throw new GradleException("Missing Gradle properties file: ${sfmGradlePropertiesFile}")
    }
    sfmGradlePropertiesFile.withInputStream { sfmGradleProperties.load(it) }

    def sfmPluginVersion = gradle.startParameter.projectProperties.get('minecraft_version')
            ?: sfmGradleProperties.getProperty('minecraft_version')
    if (!sfmPluginVersion) {
        throw new GradleException("Missing minecraft_version Gradle property")
    }
    def sfmPluginClasspathFile = file("gradle/plugins/${sfmPluginVersion}/plugin-classpath.txt")
    if (!sfmPluginClasspathFile.isFile()) {
        throw new GradleException("Missing Gradle plugin classpath file: ${sfmPluginClasspathFile}")
    }

    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
    }
    dependencies {
        sfmPluginClasspathFile
                .readLines('UTF-8')
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') }
                .each { classpath it }
    }
}

// temp reminder: avoid using --rerun-tasks while we are iterating on cleaning up the build.gradle
// as it causes things to get decompiled again and it takes a long time

apply from: "gradle/versioned-plugins.gradle"
apply from: "gradle/java-compiler.gradle"
apply from: "gradle/wrapper.gradle"
apply from: "gradle/archive-name.gradle"
apply from: "gradle/versioned-java-toolchain.gradle"
apply from: "gradle/versioned-access-transformer.gradle"
apply from: "gradle/source-excludes.gradle"

// this must come before runs for the sourcesets to be available when calling modSource project.sourceSets.gametest
apply from: "gradle/source-sets.gradle"

apply from: "gradle/idea-excludes.gradle"



// Ensure sources are available for other modules
configurations {

//    extendConfigurations(implementation, gametestImplementation, testImplementation)
//    extendConfigurations(compileOnly, gametestCompileOnly, testCompileOnly)
//    extendConfigurations(runtimeOnly, gametestRuntimeOnly, testRuntimeOnly)
//    datagenImplementation.extendsFrom(minecraft) // don't load mods when doing datagen lol
    // the extendsFrom on datagenImplementation isn't available with NeoForge so I guess I keep the old style
    // mods can break the datagen here :/
    // guess it's fine since I only have most mods on the 1.19.2 branch

    extendConfigurations(implementation, gametestImplementation, testImplementation, datagenImplementation)
    extendConfigurations(compileOnly, gametestCompileOnly, testCompileOnly, datagenCompileOnly)
    extendConfigurations(runtimeOnly, gametestRuntimeOnly, testRuntimeOnly, datagenRuntimeOnly)
//    testImplementation.extendsFrom(minecraft)
//    gametestImplementation.extendsFrom(minecraft)
//    datagenImplementation.extendsFrom(minecraft)
}

static void extendConfigurations(Configuration base, Configuration... configurations) {
    for (def configuration : configurations) {
        configuration.extendsFrom(base)
    }
}

def sfmGameTestSelection = (
        System.getProperty('sfm.gametestSelection')
                ?: (project.findProperty('sfmGameTestSelection') as String)
)?.trim()



// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        // fix annoying dependency mixin problems
        // systemProperty 'mixin.env.remapRefMap', 'true'
        // systemProperty 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"

        // Enable JetBrains runtime hotswap support
        jvmArguments '-XX:+IgnoreUnrecognizedVMOptions', '-XX:+AllowRedefinitionToAddDeleteMethods'

        modSource project.sourceSets.main
    }

    client {
        modSource project.sourceSets.gametest
        // IntelliJ should use the gametest module because this run includes gametest-only sources.
        idea.primarySourceSet.set(project.sourceSets.gametest)
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    client_teamy {
//        https://discord.com/channels/313125603924639766/1232440595738529913/1246122881516048445
        runType 'client'

        modSource project.sourceSets.gametest
        // IntelliJ should use the gametest module because this run includes gametest-only sources.
        idea.primarySourceSet.set(project.sourceSets.gametest)
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

        // THIS CAN CAUSE PROBLEMS! DISABLE AND REGEN RUNS IF ENCOUNTERING WEIRD ISSUES!
        // Plays nice with: https://github.com/JetBrains/JetBrainsRuntime/releases/tag/jbr-release-17.0.14b1367.22
        // Causes problems with: jbrsdk_jcef-17.0.6-x64-b469
        jvmArguments '-XX:+AllowEnhancedClassRedefinition', '-XX:+IgnoreUnrecognizedVMOptions', '-XX:+AllowRedefinitionToAddDeleteMethods'

        arguments '--username', 'TeamDman', '--uuid', '83f1df8b-0ba3-4de0-8a26-e51a1fd74318', '--width', '1708', '--height', '960'
    }

    server {
        modSource project.sourceSets.gametest
        // IntelliJ should use the gametest module because this run includes gametest-only sources.
        idea.primarySourceSet.set(project.sourceSets.gametest)
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        modSource project.sourceSets.gametest
        // IntelliJ should use the gametest module because this run includes gametest-only sources.
        idea.primarySourceSet.set(project.sourceSets.gametest)
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        if (sfmGameTestSelection) {
            systemProperty 'sfm.gametestSelection', sfmGameTestSelection
        }
    }

    clientData {
        modSource project.sourceSets.datagen
        // IntelliJ uses this source set to choose the module/classpath for the generated run config.
        idea.primarySourceSet.set(project.sourceSets.datagen)
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// this is handled in mods.toml from 1.20.2+
//mixin {
