if (project.ext.has('sfmSourceExcludesConfigured')) {
    throw new GradleException("source-excludes.gradle must not be applied more than once")
}

def sfmSourceExcludeVersion = project.minecraft_version.toString()
def sfmSourceExcludeDir = file("gradle/source-excludes/${sfmSourceExcludeVersion}")

if (!sfmSourceExcludeDir.isDirectory()) {
    def available = file("gradle/source-excludes")
            .listFiles()
            ?.findAll { it.isDirectory() }
            ?.collect { it.name }
            ?.sort()
            ?.join(', ')
    throw new GradleException(
            "No source exclude list found for minecraft_version=${sfmSourceExcludeVersion}. "
            + "Expected ${sfmSourceExcludeDir}. Available versions: ${available ?: '(none)'}"
    )
}

def readSourceExcludeList = { String name ->
    def excludeFile = file("${sfmSourceExcludeDir}/${name}.txt")
    if (!excludeFile.isFile()) {
        throw new GradleException("Missing source exclude file: ${excludeFile}")
    }
    excludeFile
            .readLines('UTF-8')
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') }
}

ext.sfmSourceExcludeVersion = sfmSourceExcludeVersion

ext.sfmSourceSetJavaExcludes = [
        main    : (readSourceExcludeList('main-java') + (project.ext.sfmFeatureSourceExcludes?.main ?: [])),
        test    : (readSourceExcludeList('test-java') + (project.ext.sfmFeatureSourceExcludes?.test ?: [])),
        gametest: (readSourceExcludeList('gametest-java') + (project.ext.sfmFeatureSourceExcludes?.gametest ?: []))
]

ext.sfmSourceExcludesConfigured = true
