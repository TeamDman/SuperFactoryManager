if (project.ext.has('sfmConfigurationsConfigured')) {
    throw new GradleException("versioned-configurations.gradle must not be applied more than once")
}

if (!project.ext.has('sfmSourceSetsConfigured')) {
    throw new GradleException("versioned-configurations.gradle requires source-sets.gradle to be applied first")
}

def sfmConfigurationsVersion = project.minecraft_version.toString()
def sfmConfigurationsScript = file("gradle/configurations/${sfmConfigurationsVersion}/configurations.gradle")

if (!sfmConfigurationsScript.isFile()) {
    def available = file("gradle/configurations")
            .listFiles()
            ?.findAll { it.isDirectory() }
            ?.collect { it.name }
            ?.sort()
            ?.join(', ')
    throw new GradleException(
            "No configurations script found for minecraft_version=${sfmConfigurationsVersion}. "
            + "Expected ${sfmConfigurationsScript}. Available versions: ${available ?: '(none)'}"
    )
}

ext.sfmConfigurationsVersion = sfmConfigurationsVersion

apply from: sfmConfigurationsScript

ext.sfmConfigurationsConfigured = true
