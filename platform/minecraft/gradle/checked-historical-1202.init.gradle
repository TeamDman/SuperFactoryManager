gradle.beforeProject { project ->
    if (project != project.rootProject) return
    def checkout = project.projectDir.toPath().toAbsolutePath().normalize().resolve('../../../../../').normalize()
    def manifestFile = checkout.resolve('platform/minecraft/gradle/checked-historical-1202-libraries.json').toFile()
    if (sha256(manifestFile) != '8BD5CE04FA3820B964AF37E2AEA155D167A68A2958BADC6EF6BEBA73BC13FAE3') {
        throw new GradleException('Checked historical Minecraft libraries changed')
    }
    def manifest = new JsonSlurper().parse(manifestFile)
    def lockFile = checkout.resolve('platform/minecraft/projections/sfm-4.35.0/mc-1.20.2/sfm-toolchain.lock.json').toFile()
    def cache = checkout.resolve('sfm-toolchain-data').toRealPath()
    def versionFile = cache.resolve('minecraft-toolchain/minecraft/versions/1.20.2/version.json').toFile()
    if (manifest.schema_version != 1 || manifest.projection != 'sfm-4.35.0/mc-1.20.2'
            || manifest.file_count != 88 || manifest.files.size() != 88
            || manifest.source_root != 'minecraft-toolchain/minecraft/libraries'
            || manifest.gradle_root != 'caches/minecraft/libraries'
            || sha256(lockFile) != manifest.selected_lock_sha256
            || sha256(versionFile) != manifest.version_json_sha256) {
        throw new GradleException('Checked historical library recipe changed')
    }
    def metadata = new JsonSlurper().parse(versionFile)
    def official = new LinkedHashMap<String, Map>()
    metadata.libraries.each { lib ->
        def downloads = []
        if (lib.downloads.artifact) downloads.add(lib.downloads.artifact)
        if (lib.downloads.classifiers) downloads.addAll(lib.downloads.classifiers.values())
        downloads.each { item ->
            if (official.put(item.path.toString(), [coordinate:lib.name.toString(), bytes:item.size,
                    sha1:item.sha1.toString().toUpperCase(Locale.ROOT), url:item.url.toString()]) != null) {
                throw new GradleException('Duplicate official Minecraft library path')
            }
        }
    }
    if (official.size() != 88) throw new GradleException('Official Minecraft library set changed')
    def root = cache.resolve(manifest.source_root).toRealPath()
    def versions = new LinkedHashSet<List<String>>()
    manifest.files.each { item ->
        def path = item.path.toString()
        def pin = official.remove(path)
        def parts = item.coordinate.toString().split(':')
        if (!pin || !(parts.size() in [3, 4]) || pin.coordinate != item.coordinate
                || pin.bytes != item.bytes || pin.sha1 != item.sha1 || pin.url != item.url
                || item.url != 'https://libraries.minecraft.net/' + path) {
            throw new GradleException('Checked historical Minecraft library differs from official version metadata')
        }
        def expected = parts[0].replace('.', '/') + '/' + parts[1] + '/' + parts[2] + '/' + parts[1] + '-' + parts[2] + (parts.size() == 4 ? '-' + parts[3] : '') + '.jar'
        if (path != expected) throw new GradleException('Minecraft library Maven path changed')
        def file = root.resolve(path).toFile()
        if (!file.canonicalFile.toPath().startsWith(root) || file.length() != item.bytes
                || sha256(file) != item.sha256.toString().toUpperCase(Locale.ROOT)) {
            throw new GradleException("Checked historical Minecraft library payload changed: ${path}")
        }
        versions.add([parts[0], parts[1], parts[2]])
    }
    if (!official.isEmpty()) throw new GradleException('Unchecked Minecraft library remains')
    def checkedLibraryRepository = project.repositories.maven {
        name = 'SfmCheckedHistoricalMinecraftLibraries1202'
        url = root.toUri()
        metadataSources { artifact() }
    }
    project.repositories.exclusiveContent {
        forRepositories(checkedLibraryRepository)
        filter { versions.each { part -> includeVersion(part[0], part[1], part[2]) } }
    }
    println "SFM_CHECKED_HISTORICAL_GAME_LIBRARIES1202\t${root}\t${manifest.files.size()}"
}
