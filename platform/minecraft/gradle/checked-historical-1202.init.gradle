gradle.beforeProject { project ->
    if (project != project.rootProject) return
    def projection = project.projectDir.toPath().toAbsolutePath().normalize()
    def checkout = projection.resolve('../../../../../').normalize()
    def manifestFile = checkout.resolve('platform/minecraft/gradle/checked-historical-1202-neoforge-inputs.json').toFile()
    if (sha256(manifestFile) != '5C65A7A8DA22E5DFFA35432B9152F136EAF255302BAA5F05C702B5DBA1D6E242') {
        throw new GradleException('Checked NeoForge consumer manifest changed')
    }
    def manifest = new JsonSlurper().parse(manifestFile)
    if (manifest.schema_version != 1 || manifest.projection != 'sfm-4.35.0/mc-1.20.2'
            || manifest.artifact_count != 85 || manifest.files.size() != 85) {
        throw new GradleException('Checked NeoForge consumer selection changed')
    }
    if (sha256(projection.resolve('sfm-toolchain.lock.json').toFile()) != manifest.selected_lock_sha256
            || sha256(checkout.resolve('sfm-toolchain-data/minecraft-toolchain/minecraft/versions/1.20.2/version.json').toFile()) != manifest.minecraft_version_sha256
            || sha256(checkout.resolve('sfm-toolchain-data/minecraft-toolchain/maven/net/neoforged/neoforge/20.2.86/neoforge-20.2.86.pom').toFile()) != manifest.neoforge_pom_sha256) {
        throw new GradleException('Checked NeoForge consumer input recipe changed')
    }
    def cache = checkout.resolve('sfm-toolchain-data').toRealPath()
    def repositories = [
            locked_maven: cache.resolve('minecraft-toolchain/maven').toRealPath(),
            minecraft_libraries: cache.resolve('minecraft-toolchain/minecraft/libraries').toRealPath()]
    def selected = [:].withDefault { new LinkedHashSet<List<String>>() }
    def seen = new HashSet<String>()
    manifest.files.each { item ->
        def coord = item.coordinate.toString()
        if (!seen.add(coord)) throw new GradleException('Duplicate checked NeoForge coordinate')
        def parts = coord.split(':')
        if (!(parts.size() in [3, 4]) || !repositories.containsKey(item.repository.toString())) {
            throw new GradleException('Invalid checked NeoForge coordinate or repository')
        }
        def path = item.path.toString()
        def expected = parts[0].replace('.', '/') + '/' + parts[1] + '/' + parts[2] + '/' + parts[1] + '-' + parts[2] + (parts.size() == 4 ? '-' + parts[3] : '') + '.jar'
        if (path != expected) throw new GradleException('Checked NeoForge Maven path differs')
        def root = repositories[item.repository.toString()]
        def file = root.resolve(path).toFile()
        if (!file.canonicalFile.toPath().startsWith(root) || file.length() != item.bytes
                || sha256(file) != item.sha256.toString().toUpperCase(Locale.ROOT)) {
            throw new GradleException("Checked NeoForge consumer bytes changed: ${coord}")
        }
        selected[item.repository.toString()].add([parts[0], parts[1], parts[2]])
    }
    repositories.each { repoKey, root ->
        project.repositories.maven {
            name = 'SfmCheckedNeoForge20286_' + repoKey
            url = root.toUri()
            content {
                selected[repoKey].each { part -> includeVersion(part[0], part[1], part[2]) }
            }
            metadataSources { artifact() }
        }
    }
    println "SFM_CHECKED_NEOFORGE20286_CONSUMER\t${manifest.files.size()}\t${selected.locked_maven.size()}\t${selected.minecraft_libraries.size()}"
}
