def sfmDependenciesVersion = project.minecraft_version.toString()
def sfmDependenciesScript = file("gradle/dependencies/${sfmDependenciesVersion}/dependencies.gradle")

if (!sfmDependenciesScript.isFile()) {
    def available = file("gradle/dependencies")
            .listFiles()
            ?.findAll { it.isDirectory() }
            ?.collect { it.name }
            ?.sort()
            ?.join(', ')
    throw new GradleException(
            "No dependencies script found for minecraft_version=${sfmDependenciesVersion}. "
            + "Expected ${sfmDependenciesScript}. Available versions: ${available ?: '(none)'}"
    )
}

ext.sfmDependenciesVersion = sfmDependenciesVersion

apply from: sfmDependenciesScript
