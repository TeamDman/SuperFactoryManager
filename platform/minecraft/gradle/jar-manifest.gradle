if (project.ext.has('sfmJarManifestConfigured')) {
    throw new GradleException("jar-manifest.gradle must not be applied more than once")
}

if (!project.ext.has('sfmPluginsConfigured')) {
    throw new GradleException("jar-manifest.gradle requires versioned-plugins.gradle to be applied first")
}

if (!project.ext.has('sfmArchiveNameConfigured')) {
    throw new GradleException("jar-manifest.gradle requires archive-name.gradle to be applied first")
}

ext.sfmJarManifestConfigured = true

// Example for how to get properties into the manifest for reading at runtime.
jar {
    exclude "ca/teamdman/sfm/client/handler/SFMClientSmokeRunHarness.class"
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
