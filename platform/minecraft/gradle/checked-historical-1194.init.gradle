// Opt-in, repository-owned historical Gradle route. The released project and
// schema-2 lock remain byte-identical. Gradle needs no Rust installation.
import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import java.security.MessageDigest

def expectedManifestSha256 = 'F7CE3E9F0EBEEA5E716A4AF91BFF335DDB864688533C75EC768DF3F0D0EE5062'
def sha256 = { File file ->
    if (!file.isFile()) throw new GradleException("Missing SFM checked input: ${file}")
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        def buffer = new byte[65536]
        int count
        while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    digest.digest().encodeHex().toString().toUpperCase(Locale.ROOT)
}

// Seal the effective historical plugin execution graph while leaving the
// released projection's dynamic plugin declarations byte-identical.
def expectedPluginManifestSha256 = '20F7E8AC0513BAC30AC64586CBC8416D020295E69710839737E69A7B7C0F5384'
gradle.beforeProject { project ->
    if (project != project.rootProject) return
    def projection = project.projectDir.toPath().toAbsolutePath().normalize()
    def checkout = projection.resolve('../../../../../').normalize()
    if (projection.fileName.toString() != 'mc-1.19.4'
            || projection.parent.fileName.toString() != 'sfm-4.35.0'
            || projection.parent.parent != checkout.resolve('platform/minecraft/projections')
            || !checkout.resolve('.git').toFile().exists()) {
        throw new GradleException('SFM plugin seal requires the selected repository projection')
    }
    def manifestFile = checkout.resolve(
            'platform/minecraft/gradle/checked-historical-1194-plugin-inputs.json').toFile()
    if (sha256(manifestFile) != expectedPluginManifestSha256) {
        throw new GradleException('SFM historical plugin manifest changed')
    }
    def manifest = new JsonSlurper().parse(manifestFile)
    def lock = projection.resolve('sfm-toolchain.lock.json').toFile()
    if (manifest.schema_version != 1 || manifest.projection != 'sfm-4.35.0/mc-1.19.4'
            || manifest.file_count != 37 || manifest.files.size() != 37
            || sha256(lock) != manifest.selected_lock_sha256) {
        throw new GradleException('SFM historical plugin selection or lock changed')
    }
    def requiredMarkers = [
            'net.minecraftforge.gradle:net.minecraftforge.gradle.gradle.plugin|5.1.+|5.1.77',
            'org.parchmentmc.librarian.forgegradle:org.parchmentmc.librarian.forgegradle.gradle.plugin|1.+|1.2.0.7-dev-SNAPSHOT',
            'org.spongepowered.mixin:org.spongepowered.mixin.gradle.plugin|0.7.+|0.7.38'
    ]
    def actualMarkers = manifest.root_plugin_markers.collect {
        "${it.coordinate}|${it.requested}|${it.selected}"
    }
    if (actualMarkers != requiredMarkers) {
        throw new GradleException('SFM historical plugin marker selection changed')
    }
    def markers = manifest.root_plugin_markers.collectEntries { [(it.coordinate): it] }
    def classpath = project.buildscript.configurations.getByName('classpath')
    classpath.resolutionStrategy.eachDependency { requested ->
        def id = requested.requested
        def marker = markers["${id.group}:${id.name}"]
        if (marker != null) {
            if (id.version != marker.requested) {
                throw new GradleException("SFM plugin marker request changed: ${id.group}:${id.name}:${id.version}")
            }
            requested.useVersion(marker.selected)
        }
    }
    classpath.incoming.afterResolve {
        def files = classpath.files.toList()
        if (files.size() != 37) {
            throw new GradleException("SFM historical plugin classpath count changed: ${files.size()}")
        }
        def artifacts = classpath.resolvedConfiguration.resolvedArtifacts
        def coordinateByFile = [:]
        artifacts.each { artifact ->
            def id = artifact.moduleVersion.id
            def path = artifact.file.canonicalPath
            if (coordinateByFile.put(path, "${id.group}:${id.name}:${id.version}") != null) {
                throw new GradleException("SFM historical plugin artifact path repeated: ${path}")
            }
        }
        files.eachWithIndex { file, index ->
            def expected = manifest.files[index]
            if (expected.index != index || file.name != expected.filename
                    || file.length() != expected.bytes
                    || sha256(file) != expected.sha256
                    || coordinateByFile[file.canonicalPath] != expected.coordinate) {
                throw new GradleException("SFM historical plugin classpath differs at ${index}: ${file.name}")
            }
        }
        if (coordinateByFile.size() != 37) {
            throw new GradleException('SFM historical plugin artifact coordinate count changed')
        }
        println 'SFM_CHECKED_HISTORICAL_PLUGINS1194 files=37 markers=3'
    }
}
gradle.beforeSettings { settings ->
    def projection = settings.settingsDir.toPath().toAbsolutePath().normalize()
    def checkout = projection.resolve('../../../../../').normalize()
    if (projection.fileName.toString() != 'mc-1.19.4'
            || projection.parent.fileName.toString() != 'sfm-4.35.0'
            || projection.parent.parent != checkout.resolve('platform/minecraft/projections')
            || !checkout.resolve('.git').toFile().exists()) {
        throw new GradleException('SFM historical checked route requires the selected repository projection')
    }
}

gradle.beforeProject { project ->
    if (project != project.rootProject) return
    def projection = project.projectDir.toPath().toAbsolutePath().normalize()
    def checkout = projection.resolve('../../../../../').normalize()
    if (projection.fileName.toString() != 'mc-1.19.4'
            || projection.parent.fileName.toString() != 'sfm-4.35.0'
            || projection.parent.parent != checkout.resolve('platform/minecraft/projections')
            || !checkout.resolve('.git').toFile().exists()) {
        throw new GradleException('SFM historical checked route requires the selected repository projection')
    }
    def manifestFile = checkout.resolve(
            'platform/minecraft/gradle/checked-historical-1194-inputs.json').toFile()
    if (sha256(manifestFile) != expectedManifestSha256) {
        throw new GradleException('SFM historical checked manifest changed')
    }
    def manifest = new JsonSlurper().parse(manifestFile)
    if (manifest.schema_version != 1 || manifest.projection != 'sfm-4.35.0/mc-1.19.4'
            || manifest.original_checked_jar_count != 37 || manifest.official_module_count != 8
            || manifest.files.size() != 82) {
        throw new GradleException('SFM historical checked manifest selection changed')
    }
    def lock = projection.resolve('sfm-toolchain.lock.json').toFile()
    if (sha256(lock) != manifest.selected_lock_sha256) {
        throw new GradleException('SFM historical lock identity changed')
    }
    def logicalCache = checkout.resolve('sfm-toolchain-data')
    def markerFile = logicalCache.resolve('.sfm-native-cache-root.json').toFile()
    if (!markerFile.isFile() || markerFile.length() > 65536) {
        throw new GradleException('SFM repository cache ownership marker is missing or oversized')
    }
    def markerExpected = ('["sfm:native_cache_root@1",'
            + JsonOutput.toJson(logicalCache.toString()) + ']').getBytes('UTF-8')
    if (!java.util.Arrays.equals(markerFile.bytes, markerExpected)) {
        throw new GradleException('SFM repository cache marker belongs to another root')
    }
    def physicalRoot = logicalCache.resolve('minecraft-toolchain').toRealPath()
    def snapshot = manifest.historical_version_snapshot
    if (snapshot.path != 'minecraft/versions/1.19.4/snapshots/dbd2e0a5aaf8b05447833b5de6d368e28e8cc7f0.json'
            || snapshot.sha256 != '3F13A8AD2A69B9835E746768FBBD8CC1FC0F51F8CD720182AA3183474774E5C9'
            || snapshot.pin_domain != 'blake3:67a80a4a8aee41acada9402384cbddce75eab776') {
        throw new GradleException('SFM historical version snapshot selection changed')
    }
    def snapshotFile = physicalRoot.resolve(snapshot.path).toFile().canonicalFile
    if (!snapshotFile.toPath().startsWith(physicalRoot) || sha256(snapshotFile) != snapshot.sha256) {
        throw new GradleException('SFM historical version snapshot differs')
    }
    def snapshotLibraries = new JsonSlurper().parse(snapshotFile).libraries
    def supplement = manifest.tracked_bootstrap_supplement
    if (supplement.path != 'platform/minecraft/core-liquid-template/build/supplements/gradle-plugin-bootstrap-26.1.2.json'
            || supplement.sha256 != 'CC4F775CE334809EE0D635380E123ED30371544BEB4FC0B903E663F463DF1312') {
        throw new GradleException('SFM tracked bootstrap supplement selection changed')
    }
    def supplementFile = checkout.resolve(supplement.path).toFile().canonicalFile
    if (!supplementFile.toPath().startsWith(checkout) || sha256(supplementFile) != supplement.sha256) {
        throw new GradleException('SFM tracked bootstrap supplement differs')
    }
    def annotationPins = new JsonSlurper().parse(supplementFile).artifacts.findAll {
        it.coordinate == 'org.jetbrains:annotations:23.0.0' && it.file == 'annotations-23.0.0.jar'
    }
    if (annotationPins.size() != 1 || annotationPins[0].repository != 'maven-central') {
        throw new GradleException('SFM tracked annotation pin is unavailable')
    }
    def annotationPin = annotationPins[0]
    def seenPaths = new HashSet<String>()
    def directMaven = new LinkedHashSet<String>()
    def minecraftLibraries = new LinkedHashSet<String>()
    def published = new LinkedHashMap<String, Set<String>>()
    def checkedLwjgl = new LinkedHashMap<String, Map>()
    def checkedCompilerFiles = new LinkedHashMap<String, Map>()
    manifest.files.each { entry ->
        def parts = entry.coordinate?.toString()?.split(':', -1)
        def kind = entry.kind?.toString()
        def relative = entry.path?.toString()
        if (parts == null || parts.length != 3 || !(kind in ['jar', 'pom'])
                || relative == null || !relative.matches('[A-Za-z0-9._/-]+')
                || relative.split('/').any { it in ['', '.', '..'] }
                || !(relative.startsWith('maven/') || relative.startsWith('minecraft/libraries/'))
                || !seenPaths.add(relative)) {
            throw new GradleException('Invalid or duplicate SFM checked module path')
        }
        def coordinatePath = parts[0].replace('.', '/') + '/' + parts[1] + '/' + parts[2] + '/'
        def expectedName = parts[1] + '-' + parts[2]
        def tail = relative.startsWith('maven/')
                ? relative.substring('maven/'.length())
                : relative.substring('minecraft/libraries/'.length())
        if (!tail.startsWith(coordinatePath)
                || !(kind == 'pom' ? tail == coordinatePath + expectedName + '.pom'
                        : (tail.startsWith(coordinatePath + expectedName) && tail.endsWith('.jar')))
                || !(entry.bytes instanceof Number) || entry.bytes <= 0
                || !(entry.sha256?.toString() ==~ /[A-F0-9]{64}/)) {
            throw new GradleException("Invalid SFM checked module identity: ${entry.coordinate}")
        }
        def file = physicalRoot.resolve(relative).toFile().canonicalFile
        if (!file.toPath().startsWith(physicalRoot) || file.length() != entry.bytes
                || sha256(file) != entry.sha256) {
            throw new GradleException("SFM checked payload differs: ${entry.coordinate} ${kind}")
        }
        if (entry.pin_domain == 'official-publisher-sha256') {
            if (!relative.startsWith('maven/')
                    || !(parts[0] in ['curse.maven', 'mezz.jei'])
                    || !(entry.upstream_url?.toString()?.startsWith(
                            parts[0] == 'curse.maven' ? 'https://www.cursemaven.com/'
                                    : 'https://maven.blamejared.com/'))) {
                throw new GradleException("Invalid SFM published module provenance: ${entry.coordinate}")
            }
            published.computeIfAbsent(entry.coordinate.toString()) { new HashSet<String>() }.add(kind)
        } else if (entry.pin_domain == 'tracked-bootstrap-supplement-sha256') {
            if (kind != 'jar' || entry.coordinate != annotationPin.coordinate
                    || relative != 'maven/' + annotationPin.path
                    || entry.bytes != annotationPin.bytes
                    || entry.sha256 != annotationPin.sha256.toUpperCase(Locale.ROOT)
                    || entry.upstream_url != annotationPin.url) {
                throw new GradleException('SFM checked annotation differs from tracked bootstrap pin')
            }
            directMaven.add(entry.coordinate.toString())
            checkedCompilerFiles[file.name] = [bytes: entry.bytes, sha256: entry.sha256]
        } else if (entry.pin_domain in ['selected-lock-blake3', 'pinned-version-metadata-sha1']) {
            if (kind != 'jar') throw new GradleException('Historical direct input is not a JAR')
            if (entry.metadata_name != null) {
                def matching = snapshotLibraries.findAll { it.name == entry.metadata_name }
                def download = matching.size() == 1 ? matching[0].downloads?.artifact : null
                if (!entry.metadata_name.toString().startsWith('org.lwjgl:')
                        || entry.coordinate != entry.metadata_name.toString().split(':', -1).take(3).join(':')
                        || download == null || relative != 'minecraft/libraries/' + download.path
                        || entry.bytes != download.size || entry.metadata_sha1 != download.sha1
                        || entry.upstream_url != download.url) {
                    throw new GradleException('SFM checked LWJGL metadata identity differs')
                }
                checkedLwjgl[entry.metadata_name.toString()] = [bytes: entry.bytes, sha256: entry.sha256]
                checkedCompilerFiles[file.name] = [bytes: entry.bytes, sha256: entry.sha256]
            }
            (relative.startsWith('maven/') ? directMaven : minecraftLibraries)
                    .add(entry.coordinate.toString())
        } else {
            throw new GradleException("Unknown SFM checked pin domain: ${entry.pin_domain}")
        }
    }
    if (seenPaths.size() != 82 || directMaven.size() != 15 || minecraftLibraries.size() != 30
            || checkedLwjgl.size() != 28 || checkedCompilerFiles.size() != 29
            || published.size() != 8 || published.values().any { it != (['jar', 'pom'] as Set) }
            || (directMaven + minecraftLibraries).intersect(published.keySet())) {
        throw new GradleException('SFM checked module closure is incomplete or overlapping')
    }
    def mavenRoot = physicalRoot.resolve('maven').toFile()
    def libraryRoot = physicalRoot.resolve('minecraft/libraries').toFile()
    def addExact = { filter, Collection<String> coordinates ->
        coordinates.each { coordinate ->
            def parts = coordinate.split(':', -1)
            filter.includeVersionByRegex(parts[0], parts[1], java.util.regex.Pattern.quote(parts[2]))
        }
    }
    def publishedRepo = project.repositories.maven {
        name = 'SFM-checked-published-1194'
        url = mavenRoot.toURI()
        metadataSources { mavenPom() }
    }
    def directRepo = project.repositories.maven {
        name = 'SFM-checked-direct-1194'
        url = mavenRoot.toURI()
        metadataSources { artifact() }
    }
    def librariesRepo = project.repositories.maven {
        name = 'SFM-checked-minecraft-1194'
        url = libraryRoot.toURI()
        metadataSources { artifact() }
    }
    [[publishedRepo, published.keySet()], [directRepo, directMaven],
            [librariesRepo, minecraftLibraries]].each { pair ->
        project.repositories.exclusiveContent {
            forRepositories(pair[0])
            filter { addExact(delegate, pair[1]) }
        }
    }
    gradle.taskGraph.whenReady { graph ->
        def compileTask = project.tasks.findByName('compileJava')
        if (compileTask != null && graph.hasTask(compileTask)) {
            def classpath = compileTask.classpath.files
            checkedCompilerFiles.each { name, expected ->
                def matches = classpath.findAll { it.name == name }
                if (matches.size() != 1 || matches[0].length() != expected.bytes
                        || sha256(matches[0]) != expected.sha256) {
                    throw new GradleException("SFM checked compiler input differs: ${name}")
                }
            }
            if (classpath.any { it.name ==~ /lwjgl(?:-[a-z]+)?-3\.3\.1(?:-.+)?\.jar/
                    && !checkedCompilerFiles.containsKey(it.name) }) {
                throw new GradleException('SFM compiler selected an undeclared LWJGL input')
            }
            println 'SFM_CHECKED_COMPILER_INPUTS lwjgl=28 annotations=1'
        }
    }
    println 'SFM_CHECKED_HISTORICAL_1194 modules=8 direct=15 minecraft=30'
}
