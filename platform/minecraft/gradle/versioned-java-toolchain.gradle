if (project.ext.has('sfmJavaToolchainConfigured')) {
    throw new GradleException("versioned-java-toolchain.gradle must not be applied more than once")
}

if (!project.ext.has('sfmPluginsConfigured')) {
    throw new GradleException("versioned-java-toolchain.gradle requires versioned-plugins.gradle to be applied first")
}

def sfmJavaToolchainVersion = project.minecraft_version.toString()
def sfmJavaToolchainScript = file("gradle/java-toolchain/${sfmJavaToolchainVersion}/java-toolchain.gradle")

if (!sfmJavaToolchainScript.isFile()) {
    def available = file("gradle/java-toolchain")
            .listFiles()
            ?.findAll { it.isDirectory() }
            ?.collect { it.name }
            ?.sort()
            ?.join(', ')
    throw new GradleException(
            "No Java toolchain script found for minecraft_version=${sfmJavaToolchainVersion}. "
            + "Expected ${sfmJavaToolchainScript}. Available versions: ${available ?: '(none)'}"
    )
}

ext.sfmJavaToolchainVersion = sfmJavaToolchainVersion

apply from: sfmJavaToolchainScript

ext.sfmJavaToolchainConfigured = true
