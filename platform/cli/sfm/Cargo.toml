[package]
name = "sfm"
version = "0.1.0"
edition = "2024"
authors = ["TeamDman"]
description = "Control live Super Factory Manager Minecraft clients"
license = "MPL-2.0"
repository = "https://github.com/TeamDman/SuperFactoryManager"
readme = "README.md"
keywords = ["minecraft", "super-factory-manager", "cli", "vox"]
categories = ["command-line-utilities", "development-tools"]
autobins = false

[dependencies]
color-eyre = "0.6.5"
directories-next = "2.0.0"
eyre = "0.6.12"
facet = { package = "teamy-facet", version = "=0.50.0-rc.7" }
facet-csv = { git = "https://github.com/TeamDman/facet-format.git", rev = "642d268fc01eced0a861bded044342ff88733eec", package = "teamy-facet-csv" }
facet-json = { package = "teamy-facet-json", version = "=0.50.0-rc.9" }
facet-pretty = { package = "teamy-facet-pretty", version = "=0.50.0-rc.7" }
figue = { package = "teamy-figue", version = "=6.0.0-rc.5" }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "time"] }
vox = { git = "https://github.com/TeamDman/vox.git", rev = "5628c00d9f3816199f324a9ccc081de8a3a1b1bc", package = "teamy-vox", default-features = false, features = ["runtime", "transport-tcp"] }
vox-codegen = { git = "https://github.com/TeamDman/vox.git", rev = "5628c00d9f3816199f324a9ccc081de8a3a1b1bc", package = "teamy-vox-codegen", optional = true }

[target.'cfg(windows)'.dependencies]
teamy-windows = "0.9.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = []
codegen = ["dep:vox-codegen"]

[[bin]]
name = "sfm"
path = "src/main.rs"

[[bin]]
name = "sfm-codegen"
path = "src/bin/sfm_codegen.rs"
required-features = ["codegen"]

[lints.rust]
ambiguous_negative_literals = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

# Keep the unpublished CSV adapter on the same published reflection identity.
[patch."https://github.com/TeamDman/facet-format.git"]
teamy-facet = { version = "=0.50.0-rc.7" }
teamy-facet-core = { version = "=0.50.0-rc.7" }
teamy-facet-reflect = { version = "=0.50.0-rc.7" }
teamy-facet-format = { version = "=0.50.0-rc.9" }
