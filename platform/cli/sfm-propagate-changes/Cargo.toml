[package]
name = "sfm-propagate-changes"
version = "0.1.1"
edition = "2024"
authors = ["TeamDman"]
description = "CLI tool for propagating git changes across Minecraft version worktrees"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/TeamDman/SuperFactoryManager"
keywords = ["cli", "git", "minecraft", "worktree"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
arborium-java = "=2.18.1"
base64 = "0.22.1"
blake3 = "1.8.5"
chrono = "0.4.43"
color-eyre = "0.6.5"
ctrlc = "3.5.1"
directories-next = "2.0.0"
dunce = "1.0.5"
eyre = "0.6.12"
facet = { git = "https://github.com/TeamDman/facet.git", rev = "f1e1eed9a7d91c6bbb4dcb54c985617d6c914fad", package = "facet" }
facet-csv = { git = "https://github.com/TeamDman/facet.git", rev = "f1e1eed9a7d91c6bbb4dcb54c985617d6c914fad", package = "facet-csv" }
facet-json = { git = "https://github.com/TeamDman/facet.git", rev = "f1e1eed9a7d91c6bbb4dcb54c985617d6c914fad", package = "facet-json" }
facet-pretty = { git = "https://github.com/TeamDman/facet.git", rev = "f1e1eed9a7d91c6bbb4dcb54c985617d6c914fad", package = "facet-pretty" }
facet-styx = { git = "https://github.com/TeamDman/facet.git", rev = "f1e1eed9a7d91c6bbb4dcb54c985617d6c914fad", package = "facet-styx" }
figue = { git = "https://github.com/TeamDman/facet.git", rev = "f1e1eed9a7d91c6bbb4dcb54c985617d6c914fad", package = "figue", features = ["arbitrary"] }
glob = "0.3.3"
gix = { version = "0.84.0", default-features = false, features = ["blob-diff", "blocking-http-transport-reqwest-rust-tls", "index", "sha1", "worktree-stream"] }
humansize = "2.1.3"
humantime = "2.1.0"
open = { version = "5.3.3", features = ["shellexecute-on-windows"] }
rand = "0.9.2"
ratatui = "0.30.0"
rayon = "1.12.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = ["full"] }
tree-sitter-patched-arborium = "=0.25.10"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing-tracy = { version = "0.11.4", optional = true, default-features = false, features = ["enable", "system-tracing", "context-switch-tracing", "sampling", "code-transfer", "callstack-inlines", "only-localhost"] }
tracy-client = { version = "0.18.4", optional = true, default-features = false }
unicode-normalization = "0.1.24"
walkdir = "2.5.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
teamy-windows = "0.9.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }

[features]
default = []
tracy = ["dep:tracing-tracy", "dep:tracy-client"]
tracing_detailed = []
tracy_memory = ["tracy"]

[build-dependencies]
embed-resource = "3.0.6"

[[test]]
name = "java_analysis_scenarios"
path = "tests/java_analysis/java_analysis_scenario_test.rs"

[lints.rust]
ambiguous_negative_literals = "warn"
# missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
multiple_crate_versions = "allow" # turn this off periodically to see how bad it has gotten :P
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives
multiple_unsafe_ops_per_block = "deny"
module_inception = "allow"
allow_attributes = "deny"
# allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "allow" # facet macros use Unicode identifiers
disallowed_methods = "forbid"
disallowed_types = "forbid"
disallowed_macros = "forbid"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
