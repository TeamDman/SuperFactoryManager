name: SFM 1.19.2 Windows verification

on:
  push:
    branches:
      - '1.19.2'
      - 'ci/1.19.2-container-puppet'
      - 'ci/1.19.2-windows-build'
  pull_request:
    branches:
      - '1.19.2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sfm-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Compile, test and package (Windows)
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
      RUST_BACKTRACE: '1'
      RUSTUP_TOOLCHAIN: '1.96.0'
      JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF-8'
    steps:
      - name: Check out the event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the checked-out revision for the SFM CLI
        run: |
          # Preserve the exact event tree, including GitHub's PR merge revision.
          git switch --create sfm-ci-checkout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/windows-ci | Out-Null
          "SFM_PROPAGATE_CHANGES_HOME=$(Join-Path $env:RUNNER_TEMP 'sfm-home')" >> $env:GITHUB_ENV
          "SFM_PROPAGATE_CHANGES_CACHE=$(Join-Path $env:RUNNER_TEMP 'sfm-cache')" >> $env:GITHUB_ENV
          "SFM_SOURCE_BUILD_ROOT=$(Join-Path $env:RUNNER_TEMP 'sfm')" >> $env:GITHUB_ENV
          git rev-parse HEAD | Set-Content build/windows-ci/source-revision.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path platform/minecraft/gradle.properties -Pattern '^minecraft_version\s*=\s*1\.19\.2\s*$' -Quiet)) {
            throw 'This workflow verifies the Minecraft 1.19.2 source tree.'
          }

      - name: Install the compiler for the frozen Vox artifact
        id: vox-java
        timeout-minutes: 12
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jetbrains
          java-version: '17.0.6+829.9'
          java-package: jdk
          architecture: x64
          set-default: false

      - name: Set up current Java 17 for the mod
        id: mod-java
        timeout-minutes: 10
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - name: Verify both Java toolchains
        env:
          SFM_MOD_JAVA_HOME: ${{ steps.mod-java.outputs.path }}
          SFM_VOX_JAVA_HOME: ${{ steps.vox-java.outputs.path }}
        run: |
          & "$env:SFM_MOD_JAVA_HOME/bin/java.exe" -version 2>&1 | Tee-Object build/windows-ci/mod-java-version.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $voxVersion = & "$env:SFM_VOX_JAVA_HOME/bin/java.exe" -version 2>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $voxVersion | Tee-Object build/windows-ci/vox-java-version.txt
          if (($voxVersion -join "`n") -notmatch 'JBR-17\.0\.6\+10-829\.9') {
            throw 'The frozen Vox artifact requires JetBrains JDK 17.0.6+10-829.9.'
          }

      - name: Set up the Rust compiler
        timeout-minutes: 10
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the CLI from locked sources
        timeout-minutes: 30
        run: |
          cargo build --locked --release --manifest-path platform/cli/sfm-propagate-changes/Cargo.toml 2>&1 |
            Tee-Object build/windows-ci/cargo-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cli = Join-Path $env:GITHUB_WORKSPACE 'platform/cli/sfm-propagate-changes/target/release/sfm-propagate-changes.exe'
          & $cli --version | Tee-Object build/windows-ci/cli-version.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -Algorithm SHA256 -LiteralPath $cli | Format-List | Out-File build/windows-ci/cli-sha256.txt
          & $cli repo-root set $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SFM_CI_CLI=$cli" >> $env:GITHUB_ENV

      - name: Test portable dependency paths on Windows
        timeout-minutes: 15
        run: |
          cargo test --locked --release --lib --manifest-path platform/cli/sfm-propagate-changes/Cargo.toml json_path::tests 2>&1 |
            Tee-Object build/windows-ci/portable-path-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile all Java source sets
        timeout-minutes: 40
        env:
          # Only the pinned source-build recipe reads this old JAVA_HOME.
          # The SFM compiler below explicitly uses current Java 17.
          JAVA_HOME: ${{ steps.vox-java.outputs.path }}
          SFM_MOD_JAVA_HOME: ${{ steps.mod-java.outputs.path }}
        run: |
          & $env:SFM_CI_CLI --log-filter info --log-file build/windows-ci/compile.ndjson `
            run compile --branch sfm-ci-checkout --java-home $env:SFM_MOD_JAVA_HOME `
            --require-portable-artifacts --plan-json build/windows-ci/compile-plan.json 2>&1 |
            Tee-Object build/windows-ci/compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Java unit tests
        timeout-minutes: 15
        run: |
          & $env:SFM_CI_CLI --log-filter info --log-file build/windows-ci/test.ndjson `
            test run --branch sfm-ci-checkout --java-home $env:JAVA_HOME `
            --require-portable-artifacts 2>&1 | Tee-Object build/windows-ci/test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and inspect the distributable mod
        timeout-minutes: 15
        run: |
          & $env:SFM_CI_CLI --log-filter info --log-file build/windows-ci/package.ndjson `
            jar build --branch sfm-ci-checkout --java-home $env:JAVA_HOME `
            --require-portable-artifacts --plan-json build/windows-ci/package-plan.json 2>&1 |
            Tee-Object build/windows-ci/package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $jars = @(Get-ChildItem platform/minecraft/build/libs -Filter '*-rust.jar' -File)
          if ($jars.Count -ne 1 -or $jars[0].Length -eq 0) {
            throw 'Expected exactly one nonempty distributable mod JAR.'
          }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($jars[0].FullName)
          try {
            foreach ($entry in @('META-INF/mods.toml', 'ca/teamdman/sfm/SFM.class', 'sfm.mixins.json', 'sfm.refmap.json', 'META-INF/jarjar/metadata.json')) {
              if ($null -eq $archive.GetEntry($entry)) { throw "Packaged mod is missing $entry" }
            }
          } finally { $archive.Dispose() }
          Get-FileHash -Algorithm SHA256 -LiteralPath $jars[0].FullName | Format-List |
            Out-File build/windows-ci/mod-sha256.txt

      - name: Verify frozen dependency declarations
        if: always()
        run: |
          git diff --exit-code -- '**/Cargo.toml' '**/Cargo.lock' platform/minecraft/sfm-toolchain.lock.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the verified mod
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sfm-1.19.2-windows-${{ github.sha }}
          path: platform/minecraft/build/libs/*-rust.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sfm-windows-diagnostics-${{ github.sha }}
          path: |
            build/windows-ci/
            platform/minecraft/build/sfm-toolchain/**/*.log
            platform/minecraft/build/sfm-toolchain/**/*.args
            platform/minecraft/build/sfm-toolchain/run/**/*.json
          if-no-files-found: warn
          retention-days: 14
