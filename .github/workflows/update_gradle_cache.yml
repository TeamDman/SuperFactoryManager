# Updates the Gradle Cache when necessary
name: Update Gradle Cache

on:
  push:
    branches:
      - 1.12.2-backport
    paths: ['platform/minecraft/gradle/**', 'platform/minecraft/**.gradle', 'platform/minecraft/gradle.properties', 'platform/minecraft/buildscript.properties', 'platform/minecraft/gradlew**', 'platform/minecraft/src/main/resources/*_at.cfg']
  workflow_dispatch:

concurrency:
  group: gradle-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-cache:
    defaults:
      run:
        working-directory: platform/minecraft
    name: Update Grade Cache
    runs-on: ubuntu-latest
    env:
      DISABLE_BUILDSCRIPT_UPDATE_CHECK: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Build
        uses: ./.github/actions/build_setup
        with:
          update-cache: true

      - name: Build Project with Gradle
        run: ./gradlew assemble --warning-mode all --build-cache